<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark's Social Hub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        Mark's Social Hub
    </header>
    
    <div class="container">
        <div class="post">
            <div class="post-header">
                <img class="profile-pic" src="https://via.placeholder.com/50" alt="User Profile">
                <strong>John Doe</strong>
            </div>
            <p>Had a great day working on my new project! 🚀</p>
            <button class="like-btn" onclick="likePost(this)">Like</button>
        </div>
        
        <div class="post">
            <div class="post-header">
                <img class="profile-pic" src="https://via.placeholder.com/50" alt="User Profile">
                <strong>Jane Smith</strong>
            </div>
            <p>Excited to share my latest coding tutorial! 💻</p>
            <button class="like-btn" onclick="likePost(this)">Like</button>
        </div>
    </div>
    
    <footer>
        &copy; 2025 Mark's Social Hub
    </footer>
    
    <script>
        function likePost(button) {
            button.textContent = 'Liked!';
            button.style.backgroundColor = '#1da1f2';
            button.style.color = 'white';
        }
    </script>
</body>
</html>
